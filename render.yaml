# Render Blueprint: a shareable demo behind one password. Create it at dashboard.render.com → New → Blueprint.
# Secrets are entered in the Render dashboard (sync: false), never committed.
services:
  - type: web
    name: lila-demo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node server/index.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: HOST
        value: 0.0.0.0
      - key: DEMO_PASSWORD
        sync: false
      # Optional. Without these the scripted responder and the seed budget are used.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NESSIE_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
